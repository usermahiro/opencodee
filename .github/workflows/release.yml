name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Check signing configuration
        run: |
          test -f keystore/release.jks || {
            echo "::error::Missing keystore/release.jks"
            exit 1
          }

          test -f keystore/keystore.properties || {
            echo "::error::Missing keystore/keystore.properties"
            exit 1
          }

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        env:
          VERSION_OFFSET: ${{ vars.VERSION_OFFSET }}
        run: |
          # gradle.properties is the single source of truth. CI adds the build number to
          # versionName so a new build always compares newer in the in-app updater.
          VERSION=$(sed -n 's/^appVersionName=//p' gradle.properties | head -n 1)
          test -n "$VERSION" || { echo "::error::appVersionName missing in gradle.properties"; exit 1; }

          OFFSET=${VERSION_OFFSET:-0}
          VERSION_CODE=$((GITHUB_RUN_NUMBER + OFFSET))
          FULL_VERSION="$VERSION build ${GITHUB_RUN_NUMBER}"
          SAFE_VERSION="$(echo "$VERSION" | tr -c "A-Za-z0-9._-" "-" | sed -E "s/-+/-/g; s/^-|-$//g")"
          APK_NAME="opencode-mobile-${SAFE_VERSION}-${GITHUB_RUN_NUMBER}.apk"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SAFE_VERSION=$SAFE_VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersionCode="$VERSION_CODE" -PappVersionName="$FULL_VERSION"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in $ANDROID_HOME/build-tools"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          cp "$SOURCE_APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TARGET_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          TAG="v${SAFE_VERSION}-build${GITHUB_RUN_NUMBER}"
          TITLE="OpenCode Mobile ${VERSION} (Build ${GITHUB_RUN_NUMBER})"

          NOTES="### Release Details
          - **Version:** ${VERSION}
          - **Build:** ${GITHUB_RUN_NUMBER}
          - **Commit:** ${GITHUB_SHA}
          - **Branch:** ${GITHUB_REF_NAME}"

          gh release create "$TAG" \
            "$APK_NAME" \
            "$APK_NAME.sha256" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --repo "$TARGET_REPO"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 30