# The dev machine has 11 GB of RAM: at most 2 GB for the daemon, build with --no-daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Repo whose releases the in-app updater reads (must be public, or the updater gets HTTP 404).
updateRepo=usermahiro/opencodee

# App version: single source of truth for local builds and the release workflow.
# The workflow passes "versionName build <run>" and the run number as versionCode.
appVersionName=0.0.2 beta-1
appVersionCode=36
